<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>迷宫饭金手指 · 静态预览 v2</title>
<style>
  :root{
    --paper:#f3e8d2; --paper2:#f9f1df; --sunken:#e8d9bd; --deep:#dcc9a5;
    --line:#c8c3b1; --line2:#ba8e4a; --ink:#352722; --ink2:#625349; --ink3:#756342; --muted:#8f8270;
    --mz-jsz-surface:#f9f1df; --mz-jsz-ink:#352722; --mz-jsz-line:#c8c3b1;
    --mz-jsz-ball:#8c5a2b; --mz-jsz-ball-ink:#f9f1df;
    --mz-jsz-font:-apple-system,"Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif;
    --mono:ui-monospace,Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{min-height:100vh;background:#e6dcc8;color:var(--ink);font-family:var(--mz-jsz-font);
       display:flex;flex-direction:column;align-items:center;padding:20px 16px 90px}

  .demo{width:100%;max-width:980px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;
        margin-bottom:12px;font:11px var(--mono);color:#7a6a54}
  .demo button{font:11px var(--mz-jsz-font);padding:4px 10px;border:1px solid var(--line);
        border-radius:2px;background:var(--paper);color:#5c4a38;cursor:pointer}
  .demo button[aria-pressed="true"]{background:#8c5a2b;border-color:#743e1d;color:#f9f1df}

  .stage{width:100%;max-width:980px;display:flex;justify-content:center}
  .stage[data-w="phone"]{max-width:390px}
  .chat{width:100%;background:#f7f0e2;border:1px solid var(--deep);border-radius:4px;
        min-height:540px;padding:14px 16px;position:relative;overflow:hidden}
  .bubble{max-width:78%;padding:9px 12px;border-radius:3px;background:var(--paper2);
          border:1px solid var(--line);font-size:13px;line-height:1.75;color:var(--ink2);margin-bottom:10px}
  .bubble[data-me]{margin-left:auto;background:var(--sunken)}
  .bubble small{display:block;font:10px var(--mono);color:var(--muted);margin-bottom:3px}

  /* 悬浮球与面板：与 dist/index.js 一致 */
  #mz-jsz-host{position:fixed;inset:0;z-index:2147483000;pointer-events:none;
    font-family:var(--mz-jsz-font,-apple-system,"Noto Sans SC",sans-serif)}
  #mz-jsz-host *{box-sizing:border-box}
  #mz-jsz-host .mz-jsz-ball{position:absolute;width:44px;height:44px;border-radius:50%;
    border:1px solid var(--mz-jsz-line,#ba8e4a);cursor:grab;padding:0;touch-action:none;
    pointer-events:auto;display:flex;align-items:center;justify-content:center;
    background:var(--mz-jsz-ball,#8c5a2b);color:var(--mz-jsz-ball-ink,#f9f1df);
    box-shadow:0 6px 18px -8px rgba(0,0,0,.55);transition:box-shadow .16s ease;
    -webkit-tap-highlight-color:transparent;user-select:none}
  #mz-jsz-host .mz-jsz-ball:active{cursor:grabbing}
  #mz-jsz-host .mz-jsz-ball:focus-visible{outline:2px solid var(--mz-jsz-line,#ba8e4a);outline-offset:3px}
  #mz-jsz-host .mz-jsz-ball svg{width:20px;height:20px;display:block;pointer-events:none}
  #mz-jsz-host[data-drag="1"] .mz-jsz-ball{box-shadow:0 10px 26px -8px rgba(0,0,0,.6)}
  #mz-jsz-host .mz-jsz-panel{position:absolute;pointer-events:auto;display:none;
    width:min(420px,calc(100vw - 16px));max-height:min(70vh,640px);overflow:auto;overscroll-behavior:contain;
    background:var(--mz-jsz-surface,#f9f1df);color:var(--mz-jsz-ink,#352722);
    border:1px solid var(--mz-jsz-line,#c8c3b1);border-radius:4px;padding:10px 12px;
    box-shadow:0 18px 40px -24px rgba(0,0,0,.6)}
  #mz-jsz-host[data-open="1"] .mz-jsz-panel{display:block}
  @media (max-width:480px){
    #mz-jsz-host .mz-jsz-panel{width:calc(100vw - 12px);max-height:68vh}
  }

  /* 表单：与 dist/form.js 一致 */
  .mz-f{display:flex;flex-direction:column;gap:8px;font-size:12px;color:var(--mz-jsz-ink,#352722)}
  .mz-f-t{font:600 12.5px/1.6 inherit;letter-spacing:.06em;color:#743e1d}
  .mz-f-bar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;
    padding-bottom:7px;border-bottom:1px dashed var(--mz-jsz-line,#c8c3b1)}
  .mz-f-bar label{font-size:11px;color:#756342}
  .mz-f-bar input[type=number]{width:64px}
  .mz-tabs{display:flex;gap:4px;flex-wrap:wrap;padding:2px 0 6px;
    border-bottom:1px solid var(--mz-jsz-line,#c8c3b1)}
  .mz-tab{font:12px inherit;padding:4px 11px;border-radius:2px;cursor:pointer;
    border:1px solid transparent;background:transparent;color:#796a5c}
  .mz-tab:hover{color:#743e1d}
  .mz-tab[aria-selected="true"]{border-color:var(--mz-jsz-line,#c8c3b1);
    background:var(--mz-jsz-surface,#f9f1df);color:#5c250f;font-weight:600;
    box-shadow:inset 0 -2px 0 #8c5a2b}
  .mz-page{display:none;flex-direction:column;gap:2px}
  .mz-page[data-on="1"]{display:flex}
  .mz-f input,.mz-f select,.mz-f textarea{
    font:12px/1.5 inherit;padding:4px 7px;border-radius:2px;
    border:1px solid var(--mz-jsz-line,#c8c3b1);
    background:var(--mz-jsz-surface,#f9f1df);color:var(--mz-jsz-ink,#352722)}
  .mz-f input:focus,.mz-f select:focus,.mz-f textarea:focus{outline:2px solid #d8be79;outline-offset:1px}
  .mz-f-btn{font:12px inherit;padding:5px 12px;border-radius:2px;cursor:pointer;
    border:1px solid var(--mz-jsz-line,#c8c3b1);background:transparent;color:var(--mz-jsz-ink,#352722)}
  .mz-f-btn:hover{border-color:#ba8e4a;color:#743e1d}
  .mz-f-btn[data-main]{background:#8c5a2b;border-color:#743e1d;color:#f9f1df;font-weight:600}
  .mz-f-btn[data-main]:hover{background:#743e1d;color:#fff}
  .mz-f-btn:disabled{opacity:.45;cursor:not-allowed}
  .mz-f-btn[data-mini]{padding:2px 7px;font-size:11px}
  .mz-f-btn[data-del]{border-color:#ca754a;color:#a33a2a;background:#fff4eb}
  .mz-g>h3{font:600 12px/1.6 inherit;letter-spacing:.08em;color:#743e1d;
    margin:9px 0 5px;padding-bottom:3px;border-bottom:1px solid var(--mz-jsz-line,#c8c3b1)}
  .mz-r{display:grid;grid-template-columns:88px 1fr;gap:5px 10px;align-items:center;margin:5px 0}
  .mz-r>span{font-size:11.5px;color:#625349;line-height:1.4;word-break:break-all}
  .mz-r>div{display:flex;align-items:center;gap:6px;min-width:0}
  .mz-r input[type=text],.mz-r select{width:100%}
  .mz-r input[type=checkbox]{width:15px;height:15px;accent-color:#8c5a2b}
  .mz-hint{grid-column:2;font-size:10.5px;color:#8f8270;margin-top:-2px}
  .mz-c2{display:grid;grid-template-columns:1fr 1fr;gap:8px 10px;margin:6px 0}
  .mz-mini{display:flex;flex-direction:column;gap:3px;min-width:0}
  .mz-mini>label{font-size:11px;color:#625349}
  .mz-mini input,.mz-mini select{width:100%}
  .mz-map{display:flex;flex-direction:column;gap:7px;margin:6px 0}
  .mz-item{border:1px solid var(--mz-jsz-line,#c8c3b1);border-left:2px solid #d8be79;
    border-radius:2px;padding:7px 9px;background:rgba(255,251,235,.5)}
  .mz-item-h{display:flex;align-items:center;gap:6px;margin-bottom:5px}
  .mz-item-h b{font:600 12px inherit;color:#5c250f}
  .mz-item-h .mz-sp{margin-left:auto}
  .mz-sub{display:grid;grid-template-columns:58px 1fr;gap:5px 8px;align-items:center;margin:3px 0}
  .mz-sub>span{font-size:11px;color:#756342}
  .mz-add{display:flex;gap:6px;margin-top:2px}
  .mz-add input{flex:1;min-width:0}
  .mz-empty{font-size:11.5px;color:#8f8270;padding:6px 0}
  .mz-f-foot{display:flex;align-items:center;gap:8px;flex-wrap:wrap;
    padding-top:8px;border-top:1px dashed var(--mz-jsz-line,#c8c3b1)}
  .mz-msg{margin-left:auto;font-size:11px;color:#4a6b3a}
  @media (max-width:400px){
    .mz-r{grid-template-columns:74px 1fr}
    .mz-c2{grid-template-columns:1fr}
  }
</style>
</head>

<div class="demo">
  预览：

  </div>
</div>

<div id="mz-jsz-host" data-open="1">
  <div class="mz-jsz-panel" role="dialog" aria-label="迷宫饭金手指"></div>
  <button class="mz-jsz-ball" type="button" aria-label="迷宫饭金手指（可拖动）" aria-expanded="true">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"

      <path d="M4 7h16M4 12h10M4 17h13"/><circle cx="18" cy="16.5" r="3.2"/>
    </svg>
  </button>
</div>

const host = document.getElementById('mz-jsz-host');

const clone = (o) => JSON.parse(JSON.stringify(o));
const getPath = (o, p) => p.split('.').reduce((a, k) => (a == null ? undefined : a[k]), o);
function setPath(o, p, v) {
  const ks = p.split('.'); let c = o;
  for (let i = 0; i < ks.length - 1; i++) {
    if (c[ks[i]] == null || typeof c[ks[i]] !== 'object') c[ks[i]] = {};
    c = c[ks[i]];
  }
  c[ks[ks.length - 1]] = v;
}

let draft = clone(DATA), dirty = false, curPage = 0;

panel.innerHTML = '';
const root = document.createElement('div');
root.className = 'mz-f';
root.innerHTML =
  '<div class="mz-f-bar">' +
    '<span class="mz-f-t">' + CONFIG.卡 + '</span>' +
    '<label>楼层</label><input type="number" value="12" data-f="floor">' +
    '<button class="mz-f-btn" data-mini data-f="reload">重读</button>' +
    '<span class="mz-msg" data-f="msg"></span>' +
  '</div>' +
  '<div class="mz-tabs" role="tablist"></div>' +
  '<div data-f="pages"></div>' +
  '<div class="mz-f-foot">' +
    '<button class="mz-f-btn" data-f="reset">还原</button>' +
    '<button class="mz-f-btn" data-main data-f="save" disabled>保存修改</button>' +
  '</div>';
panel.appendChild(root);

const tabsEl = root.querySelector('.mz-tabs');
const pagesEl = root.querySelector('[data-f="pages"]');
const msgEl = root.querySelector('[data-f="msg"]');
const saveBtn = root.querySelector('[data-f="save"]');

function say(t) {
  msgEl.textContent = t || '';
  if (t) setTimeout(() => { if (msgEl.textContent === t) msgEl.textContent = ''; }, 3000);
}
function markDirty() { dirty = true; saveBtn.disabled = false; saveBtn.textContent = '保存修改 ●'; }

function control(f, value, onSet) {
  let el;
  if (f.类型 === 'select') {
    el = document.createElement('select');
    (f.选项 || []).forEach((o) => {
      const op = document.createElement('option');
      op.value = String(o); op.textContent = String(o); el.appendChild(op);
    });
    el.value = value == null ? '' : String(value);
  } else if (f.类型 === 'bool') {
    el = document.createElement('input'); el.type = 'checkbox'; el.checked = !!value;
  } else if (f.类型 === 'number') {
    el = document.createElement('input'); el.type = 'number';
    if (f.min != null) el.min = f.min;
    if (f.max != null) el.max = f.max;
    el.value = value == null ? '' : value;
  } else {
    el = document.createElement('input'); el.type = 'text';
    el.value = value == null ? '' : String(value);
  }
  el.addEventListener('change', () => {
    let v;
    if (f.类型 === 'bool') v = el.checked;
    else if (f.类型 === 'number') {
      let n = Number(el.value);
      if (!isFinite(n)) n = f.min ?? 0;
      if (f.min != null) n = Math.max(f.min, n);
      if (f.max != null) n = Math.min(f.max, n);
      el.value = n; v = n;
    } else v = el.value;
    onSet(v); markDirty();
  });
  return el;
}

function mapBlock(f) {
  const wrap = document.createElement('div');
  wrap.className = 'mz-map';
  const obj = getPath(draft, f.路径);
  const keys = obj && typeof obj === 'object' ? Object.keys(obj) : [];

  if (!keys.length) {
    const e = document.createElement('div');
    e.className = 'mz-empty'; e.textContent = f.空提示 || '这里还是空的。';
    wrap.appendChild(e);
  }

  keys.forEach((k) => {
    const item = document.createElement('div');
    item.className = 'mz-item';
    const hd = document.createElement('div');
    hd.className = 'mz-item-h';
    const nm = document.createElement('b'); nm.textContent = k;
    hd.appendChild(nm);
    if (f.可删) {
      const sp = document.createElement('span'); sp.className = 'mz-sp';
      const del = document.createElement('button');
      del.className = 'mz-f-btn'; del.setAttribute('data-mini', '');
      del.setAttribute('data-del', ''); del.textContent = '移出';
      del.addEventListener('click', () => {
        const o = getPath(draft, f.路径);
        if (o && o[k] !== undefined) { delete o[k]; markDirty(); build(); }
      });
      sp.appendChild(del); hd.appendChild(sp);
    }
    item.appendChild(hd);

    (f.子字段 || []).forEach((sf) => {
      const row = document.createElement('div');
      row.className = 'mz-sub';
      const lab = document.createElement('span'); lab.textContent = sf.键;
      row.appendChild(lab);
      const box = document.createElement('div');
      const p = f.路径 + '.' + k + '.' + sf.键;
      box.appendChild(control({ ...sf, 标签: sf.键 }, getPath(draft, p), (v) => setPath(draft, p, v)));
      row.appendChild(box);
      item.appendChild(row);
    });
    wrap.appendChild(item);
  });

  if (f.可增) {
    const add = document.createElement('div');
    add.className = 'mz-add';
    const inp = document.createElement('input');
    inp.type = 'text'; inp.placeholder = f.增提示 || '输入名字后添加';
    const btn = document.createElement('button');
    btn.className = 'mz-f-btn'; btn.setAttribute('data-mini', ''); btn.textContent = '＋ 添加';
    btn.addEventListener('click', () => {
      const k = inp.value.trim(); if (!k) return;
      if (!getPath(draft, f.路径)) setPath(draft, f.路径, {});
      const o = getPath(draft, f.路径);
      if (o[k] === undefined) {
        const seed = {};
        (f.子字段 || []).forEach((sf) => {
          seed[sf.键] = sf.类型 === 'bool' ? false : (sf.类型 === 'number' ? (sf.min || 0) : '');
        });
        o[k] = seed; markDirty(); build();
      }
    });
    add.appendChild(inp); add.appendChild(btn); wrap.appendChild(add);
  }
  return wrap;
}

function groupBlock(g) {
  const sec = document.createElement('section');
  sec.className = 'mz-g';
  if (g.名) {
    const h = document.createElement('h3'); h.textContent = g.名; sec.appendChild(h);
  }
  if (g.列 === 2) {
    const grid = document.createElement('div');
    grid.className = 'mz-c2';
    (g.字段 || []).forEach((f) => {
      const cell = document.createElement('div'); cell.className = 'mz-mini';
      const lb = document.createElement('label'); lb.textContent = f.标签 || f.路径;
      cell.appendChild(lb);
      cell.appendChild(control(f, getPath(draft, f.路径), (v) => setPath(draft, f.路径, v)));
      grid.appendChild(cell);
    });
    sec.appendChild(grid);
    return sec;
  }
  (g.字段 || []).forEach((f) => {
    if (f.类型 === 'map') { sec.appendChild(mapBlock(f)); return; }
    const row = document.createElement('div'); row.className = 'mz-r';
    const lab = document.createElement('span'); lab.textContent = f.标签 || f.路径;
    row.appendChild(lab);
    const box = document.createElement('div');
    box.appendChild(control(f, getPath(draft, f.路径), (v) => setPath(draft, f.路径, v)));
    row.appendChild(box);
    if (f.提示) {
      const hint = document.createElement('div'); hint.className = 'mz-hint';
      hint.textContent = f.提示; row.appendChild(hint);
    }
    sec.appendChild(row);
  });
  return sec;
}

function build() {
  tabsEl.innerHTML = '';
  pagesEl.innerHTML = '';
  CONFIG.页.forEach((pg, i) => {
    const b = document.createElement('button');
    b.className = 'mz-tab';
    b.setAttribute('role', 'tab');
    b.setAttribute('aria-selected', i === curPage ? 'true' : 'false');
    b.textContent = pg.名;
    b.addEventListener('click', () => {
      curPage = i;
      tabsEl.querySelectorAll('.mz-tab').forEach((x, j) =>
        x.setAttribute('aria-selected', j === i ? 'true' : 'false'));
      pagesEl.querySelectorAll('.mz-page').forEach((x, j) =>
        x.setAttribute('data-on', j === i ? '1' : '0'));
    });
    tabsEl.appendChild(b);

    const box = document.createElement('div');
    box.className = 'mz-page';
    box.setAttribute('data-on', i === curPage ? '1' : '0');
    (pg.分组 || []).forEach((g) => box.appendChild(groupBlock(g)));
    pagesEl.appendChild(box);
  });
}

function reload() {
  draft = clone(DATA);
  build();
  dirty = false; saveBtn.disabled = true; saveBtn.textContent = '保存修改';
  say('已读取楼层 #12');
}

saveBtn.addEventListener('click', () => {
  if (!dirty) return;
  dirty = false; saveBtn.disabled = true; saveBtn.textContent = '保存修改';
  say('已保存到楼层 #12');
});
root.querySelector('[data-f="reset"]').addEventListener('click', reload);
root.querySelector('[data-f="reload"]').addEventListener('click', reload);

reload();

/* ---------------- 球与面板 ---------------- */
const BALL = 44;
const clamp = (x, y) => ({
  x: Math.max(6, Math.min(x, innerWidth - BALL - 6)),
  y: Math.max(6, Math.min(y, innerHeight - BALL - 6)),
});
function place(x, y) {
  const p = clamp(x, y);
  ball.style.left = p.x + 'px'; ball.style.top = p.y + 'px';
  return p;
}
function setOpen(open) {
  host.dataset.open = open ? '1' : '0';
  ball.setAttribute('aria-expanded', open ? 'true' : 'false');
  if (open) placePanel();
}
function placePanel() {
  const r = ball.getBoundingClientRect();
  const pw = panel.offsetWidth || 320, ph = panel.offsetHeight || 320;
  let left = Math.max(8, Math.min(r.right - pw, innerWidth - pw - 8));
  let top = r.top - ph - 10;
  if (top < 8) top = r.bottom + 10;
  if (top + ph > innerHeight - 8) top = Math.max(8, innerHeight - ph - 8);
  panel.style.left = left + 'px'; panel.style.top = top + 'px';
}
place(innerWidth - BALL - 16, innerHeight - BALL - 16);

let dragging = false, moved = false, sx = 0, sy = 0, ox = 0, oy = 0;
ball.addEventListener('pointerdown', (e) => {
  if (e.button !== 0) return;
  dragging = true; moved = false;
  sx = e.clientX; sy = e.clientY;
  ox = parseFloat(ball.style.left) || 0; oy = parseFloat(ball.style.top) || 0;
  try { ball.setPointerCapture(e.pointerId); } catch (err) {}
  host.dataset.drag = '1'; e.preventDefault();
});
ball.addEventListener('pointermove', (e) => {
  if (!dragging) return;
  const dx = e.clientX - sx, dy = e.clientY - sy;
  if (!moved && Math.abs(dx) + Math.abs(dy) > 4) moved = true;
  if (!moved) return;
  place(ox + dx, oy + dy);
  if (host.dataset.open === '1') placePanel();
});
function endDrag(e) {
  if (!dragging) return;
  dragging = false; host.dataset.drag = '0';
  try { ball.releasePointerCapture(e.pointerId); } catch (err) {}
  if (moved) {
    const p = { x: parseFloat(ball.style.left) || 0, y: parseFloat(ball.style.top) || 0 };
    const nearRight = p.x + BALL / 2 > innerWidth / 2;
    place(nearRight ? innerWidth - BALL - 12 : 12, p.y);
    if (host.dataset.open === '1') placePanel();
  } else setOpen(host.dataset.open !== '1');
}
ball.addEventListener('pointerup', endDrag);
ball.addEventListener('pointercancel', endDrag);
addEventListener('keydown', (e) => { if (e.key === 'Escape') setOpen(false); });
addEventListener('resize', () => {
  place(parseFloat(ball.style.left) || 0, parseFloat(ball.style.top) || 0);
  if (host.dataset.open === '1') placePanel();
});

/* ---------------- 宽度切换 ---------------- */
const stage = document.querySelector('.stage');
document.querySelectorAll('.demo button').forEach((b) => {
  b.addEventListener('click', () => {
    document.querySelectorAll('.demo button').forEach((x) => x.setAttribute('aria-pressed', 'false'));
    b.setAttribute('aria-pressed', 'true');
    stage.dataset.w = b.dataset.w;
  });
});
</script>
</body>
</html>
